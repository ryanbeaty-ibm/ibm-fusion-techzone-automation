name: Source checks

on:
  push:
  pull_request:

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install PyYAML
      - name: Python and shell syntax
        run: |
          python -m py_compile installer/techzone_lab01.py
          bash -n install-lab01.sh
          find reference/scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Offline regression checks
        run: |
          python tests/test_vault_flow.py
          python tests/test_cluster_health_gate.py
          python tests/test_release_safety.py
