# IBM Fusion Lab 02 v0.3 — FileBrowser application
# Based on the FileBrowser example from the IBM Fusion Level 4 Backup/Restore lab.
# The FileBrowser image is intentionally pinned to the lab's version (v2.18.0).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: files
  labels:
    app: filebrowser
    app.kubernetes.io/part-of: filebrowser-app
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ocs-storagecluster-ceph-rbd
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: filebrowser-config
  labels:
    app: filebrowser
    app.kubernetes.io/part-of: filebrowser-app
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ocs-storagecluster-ceph-rbd
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: my-filebrowser-config
  labels:
    app: filebrowser
    app.kubernetes.io/part-of: filebrowser-app
data:
  .filebrowser.json: |
    {
      "port": 8080,
      "baseURL": "",
      "address": "",
      "log": "stdout",
      "database": "/config/database.db",
      "root": "/files"
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: filebrowser
  labels:
    app: filebrowser
    app.kubernetes.io/part-of: filebrowser-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: filebrowser
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: filebrowser
        app.kubernetes.io/part-of: filebrowser-app
    spec:
      serviceAccountName: default
      containers:
        - name: filebrowser
          image: filebrowser/filebrowser:v2.18.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 30
          volumeMounts:
            - name: data
              mountPath: /files
            - name: config
              mountPath: /config
            - name: filebrowser-config
              mountPath: /.filebrowser.json
              subPath: .filebrowser.json
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: files
        - name: config
          persistentVolumeClaim:
            claimName: filebrowser-config
        - name: filebrowser-config
          configMap:
            name: my-filebrowser-config
---
apiVersion: v1
kind: Service
metadata:
  name: filebrowser
  labels:
    app: filebrowser
    app.kubernetes.io/part-of: filebrowser-app
spec:
  type: ClusterIP
  selector:
    app: filebrowser
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: filebrowser
  labels:
    app: filebrowser
    app.kubernetes.io/part-of: filebrowser-app
spec:
  to:
    kind: Service
    name: filebrowser
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
