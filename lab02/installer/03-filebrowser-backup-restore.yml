---
- name: Lab 02 v0.3 | FileBrowser S3 backup, alternate-namespace restore, and SHA-256 proof
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    lab02_kubeconfig: "{{ lookup('env', 'HOME') }}/.kube/lab02.conf"
    fusion_namespace: ibm-spectrum-fusion-ns
    source_namespace: filebrowser
    restored_namespace: filebrowser2
    fusion_application_name: filebrowser
    backup_policy_name: weekly-backup
    backup_location_name: hubspoke-bucket
    policy_assignment_name: filebrowser-lab02-weekly
    backup_name: filebrowser-lab02-v03-backup
    restore_name: filebrowser-lab02-v03-restore
    proof_file_name: lab02-proof-v03.bin
    proof_size_mib: 8
    poll_seconds: 15
    app_discovery_max_wait_seconds: 300
    app_ready_max_wait_seconds: 420
    backup_max_wait_seconds: 1800
    restore_max_wait_seconds: 1800
    filebrowser_manifest: "{{ playbook_dir }}/filebrowser-all-v0.3.yaml"
    lab_managed_by: lab02-ansible
  environment:
    KUBECONFIG: "{{ lab02_kubeconfig }}"
  tasks:
    - name: Confirm current OpenShift API server
      ansible.builtin.command: {argv: [oc, whoami, --show-server]}
      register: cluster_api
      changed_when: false
      check_mode: false

    - name: Refuse to modify any cluster except Lab 02
      ansible.builtin.assert:
        that:
          - "expected_hub_api_fragment in cluster_api.stdout"
        fail_msg: "Wrong hub cluster; expected API fragment {{ expected_hub_api_fragment }}. No changes made."

    - name: Require local FileBrowser manifest
      ansible.builtin.stat:
        path: "{{ filebrowser_manifest }}"
      register: manifest_file

    - name: Validate manifest is present
      ansible.builtin.assert:
        that: [manifest_file.stat.isreg | default(false)]
        fail_msg: "Missing {{ filebrowser_manifest }}; copy both v0.3 files into installer/."

    - name: Read existing S3 backup location
      ansible.builtin.command:
        argv: [oc, get, backupstoragelocations.data-protection.isf.ibm.com,
               "{{ backup_location_name }}", -n, "{{ fusion_namespace }}", -o, json]
      register: location_json
      changed_when: false
      check_mode: false

    - name: Require a connected S3 backup location
      ansible.builtin.assert:
        that:
          - "(location_json.stdout | from_json).status.phase == 'Connected'"
        fail_msg: "S3 location is not Connected; validate Lab 02 v0.2 first."

    - name: Read existing weekly backup policy
      ansible.builtin.command:
        argv: [oc, get, backuppolicies.data-protection.isf.ibm.com,
               "{{ backup_policy_name }}", -n, "{{ fusion_namespace }}", -o, json]
      register: policy_json
      changed_when: false
      check_mode: false

    - name: Require weekly policy to target the connected S3 location
      ansible.builtin.assert:
        that:
          - "(policy_json.stdout | from_json).spec.backupStorageLocation == backup_location_name"
        fail_msg: "weekly-backup does not point to hubspoke-bucket."

    - name: Check FileBrowser application StorageClass
      ansible.builtin.command:
        argv: [oc, get, storageclass, ocs-storagecluster-ceph-rbd, -o, name]
      changed_when: false
      check_mode: false

    - name: Inspect source namespace
      ansible.builtin.command:
        argv: [oc, get, namespace, "{{ source_namespace }}", -o, json, --ignore-not-found]
      register: source_namespace_json
      changed_when: false
      check_mode: false

    - name: Do not overwrite an unmanaged pre-existing source namespace
      ansible.builtin.assert:
        that:
          - "(source_namespace_json.stdout | from_json).metadata.labels.get('app.kubernetes.io/managed-by', '') == lab_managed_by"
        fail_msg: "filebrowser already exists but was not created by this lab; refusing to modify it."
      when: source_namespace_json.stdout | trim != ''

    - name: Create managed FileBrowser source namespace if absent
      ansible.builtin.command:
        argv: [oc, create, -f, '-']
        stdin: |
          apiVersion: v1
          kind: Namespace
          metadata:
            name: {{ source_namespace }}
            labels:
              app.kubernetes.io/managed-by: {{ lab_managed_by }}
              app.kubernetes.io/part-of: fusion-lab02
      when:
        - not ansible_check_mode
        - source_namespace_json.stdout | trim == ''

    - name: Detect FileBrowser manifest drift
      ansible.builtin.command:
        argv: [oc, diff, -n, "{{ source_namespace }}", -f, "{{ filebrowser_manifest }}"]
      register: filebrowser_diff
      changed_when: false
      failed_when: filebrowser_diff.rc not in [0, 1]
      when: not ansible_check_mode

    - name: Deploy the bundled FileBrowser application
      ansible.builtin.command:
        argv: [oc, apply, -n, "{{ source_namespace }}", -f, "{{ filebrowser_manifest }}"]
      register: filebrowser_apply
      changed_when: "'created' in filebrowser_apply.stdout or 'configured' in filebrowser_apply.stdout"
      when:
        - not ansible_check_mode
        - filebrowser_diff.rc == 1

    - name: Wait for FileBrowser PersistentVolumeClaims to bind
      ansible.builtin.command:
        argv: [oc, get, pvc, -n, "{{ source_namespace }}", -o, json]
      register: source_pvcs
      changed_when: false
      until: >-
        ((source_pvcs.stdout | from_json)['items'] | length) >= 2 and
        (((source_pvcs.stdout | from_json)['items'] |
          selectattr('status.phase', 'equalto', 'Bound') | list | length) >= 2)
      retries: "{{ (app_ready_max_wait_seconds // poll_seconds) | int }}"
      delay: "{{ poll_seconds }}"
      when: not ansible_check_mode

    - name: Wait until FileBrowser deployment is ready
      ansible.builtin.command:
        argv: [oc, rollout, status, deployment/filebrowser,
               -n, "{{ source_namespace }}", "--timeout={{ app_ready_max_wait_seconds }}s"]
      changed_when: false
      when: not ansible_check_mode

    - name: Wait for Fusion to discover FileBrowser as an Application
      ansible.builtin.command:
        argv: [oc, get, applications.application.isf.ibm.com,
               "{{ fusion_application_name }}", -n, "{{ fusion_namespace }}",
               -o, json, --ignore-not-found]
      register: fusion_app
      changed_when: false
      until: (fusion_app.stdout | trim) != ''
      retries: "{{ (app_discovery_max_wait_seconds // poll_seconds) | int }}"
      delay: "{{ poll_seconds }}"
      when: not ansible_check_mode

    - name: Create proof file on the source persistent volume once
      ansible.builtin.command:
        argv:
          - oc
          - exec
          - deployment/filebrowser
          - -n
          - "{{ source_namespace }}"
          - --
          - sh
          - -c
          - "test -s /files/{{ proof_file_name }} || dd if=/dev/urandom of=/files/{{ proof_file_name }} bs=1048576 count={{ proof_size_mib }}"
      register: proof_written
      changed_when: "proof_written.stderr is search('records out')"
      when: not ansible_check_mode

    - name: Calculate SHA-256 checksum of source file
      ansible.builtin.command:
        argv: [oc, exec, deployment/filebrowser, -n, "{{ source_namespace }}", --,
               sha256sum, "/files/{{ proof_file_name }}"]
      register: source_checksum
      changed_when: false
      when: not ansible_check_mode

    - name: Verify source checksum looks valid
      ansible.builtin.assert:
        that:
          - "(source_checksum.stdout.split()[0] | length) == 64"
        fail_msg: "Unable to obtain a valid source SHA-256 checksum."
      when: not ansible_check_mode

    - name: Inspect prior Lab 02 policy assignment
      ansible.builtin.command:
        argv: [oc, get, policyassignments.data-protection.isf.ibm.com,
               "{{ policy_assignment_name }}", -n, "{{ fusion_namespace }}",
               -o, json, --ignore-not-found]
      register: prior_assignment
      changed_when: false
      when: not ansible_check_mode

    - name: Refuse to overwrite an unmanaged assignment
      ansible.builtin.assert:
        that:
          - "(prior_assignment.stdout | from_json).metadata.labels.get('app.kubernetes.io/managed-by', '') == lab_managed_by"
          - "(prior_assignment.stdout | from_json).spec.application == fusion_application_name"
          - "(prior_assignment.stdout | from_json).spec.backupPolicy == backup_policy_name"
        fail_msg: "Conflicting PolicyAssignment: refusing to overwrite."
      when:
        - not ansible_check_mode
        - prior_assignment.stdout | trim != ''

    - name: Assign weekly policy without automatically re-triggering a backup
      ansible.builtin.command:
        argv: [oc, create, -f, '-']
        stdin: |
          apiVersion: data-protection.isf.ibm.com/v1alpha1
          kind: PolicyAssignment
          metadata:
            name: {{ policy_assignment_name }}
            namespace: {{ fusion_namespace }}
            labels:
              app.kubernetes.io/managed-by: {{ lab_managed_by }}
              app.kubernetes.io/part-of: fusion-lab02
          spec:
            application: {{ fusion_application_name }}
            backupPolicy: {{ backup_policy_name }}
            runNow: false
      when:
        - not ansible_check_mode
        - prior_assignment.stdout | trim == ''

    - name: Inspect existing named on-demand backup
      ansible.builtin.command:
        argv: [oc, get, backups.data-protection.isf.ibm.com, "{{ backup_name }}",
               -n, "{{ fusion_namespace }}", -o, json, --ignore-not-found]
      register: prior_backup
      changed_when: false
      when: not ansible_check_mode

    - name: Reject conflicting backup name
      ansible.builtin.assert:
        that:
          - "(prior_backup.stdout | from_json).metadata.labels.get('app.kubernetes.io/managed-by', '') == lab_managed_by"
          - "(prior_backup.stdout | from_json).spec.application == fusion_application_name"
          - "(prior_backup.stdout | from_json).spec.backupPolicy == backup_policy_name"
        fail_msg: "Existing backup name belongs to another test; override backup_name and restore_name."
      when:
        - not ansible_check_mode
        - prior_backup.stdout | trim != ''

    - name: Start a single named on-demand S3 backup if absent
      ansible.builtin.command:
        argv: [oc, create, -f, '-']
        stdin: |
          apiVersion: data-protection.isf.ibm.com/v1alpha1
          kind: Backup
          metadata:
            name: {{ backup_name }}
            namespace: {{ fusion_namespace }}
            labels:
              app.kubernetes.io/managed-by: {{ lab_managed_by }}
              app.kubernetes.io/part-of: fusion-lab02
          spec:
            application: {{ fusion_application_name }}
            backupPolicy: {{ backup_policy_name }}
      when:
        - not ansible_check_mode
        - prior_backup.stdout | trim == ''

    - name: Poll on-demand backup until it completes or fails
      ansible.builtin.command:
        argv: [oc, get, backups.data-protection.isf.ibm.com, "{{ backup_name }}",
               -n, "{{ fusion_namespace }}", '-o', 'jsonpath={.status.phase}']
      register: backup_phase
      changed_when: false
      until: (backup_phase.stdout | trim) in ['Completed', 'Failed', 'Error', 'Cancelled', 'PartiallyFailed', 'PartiallyCompleted']
      retries: "{{ (backup_max_wait_seconds // poll_seconds) | int }}"
      delay: "{{ poll_seconds }}"
      when: not ansible_check_mode

    - name: Require successful backup
      ansible.builtin.assert:
        that:
          - "(backup_phase.stdout | trim) == 'Completed'"
        fail_msg: >-
          S3 backup status: {{ backup_phase.stdout | trim }}.
          Inspect: oc describe fbackup {{ backup_name }} -n {{ fusion_namespace }}
      when: not ansible_check_mode

    - name: Check existing alternate restore namespace
      ansible.builtin.command:
        argv: [oc, get, namespace, "{{ restored_namespace }}", -o, json, --ignore-not-found]
      register: target_namespace_json
      changed_when: false
      when: not ansible_check_mode

    - name: Refuse to restore over unrelated namespace
      ansible.builtin.assert:
        that:
          - "(target_namespace_json.stdout | from_json).metadata.labels.get('app.kubernetes.io/managed-by', '') == lab_managed_by"
        fail_msg: "Restore target already exists but isn't managed by Lab 02."
      when:
        - not ansible_check_mode
        - target_namespace_json.stdout | trim != ''

    - name: Create empty, managed alternate namespace if needed
      ansible.builtin.command:
        argv: [oc, create, -f, '-']
        stdin: |
          apiVersion: v1
          kind: Namespace
          metadata:
            name: {{ restored_namespace }}
            labels:
              app.kubernetes.io/managed-by: {{ lab_managed_by }}
              app.kubernetes.io/part-of: fusion-lab02
      when:
        - not ansible_check_mode
        - target_namespace_json.stdout | trim == ''

    - name: Inspect existing named restore
      ansible.builtin.command:
        argv: [oc, get, restores.data-protection.isf.ibm.com, "{{ restore_name }}",
               -n, "{{ fusion_namespace }}", -o, json, --ignore-not-found]
      register: prior_restore
      changed_when: false
      when: not ansible_check_mode

    - name: Reject conflicting restore name
      ansible.builtin.assert:
        that:
          - "(prior_restore.stdout | from_json).metadata.labels.get('app.kubernetes.io/managed-by', '') == lab_managed_by"
          - "(prior_restore.stdout | from_json).spec.backup == backup_name"
        fail_msg: "Existing restore belongs to a different backup; choose a new restore_name."
      when:
        - not ansible_check_mode
        - prior_restore.stdout | trim != ''

    - name: Create restore into filebrowser2 if absent
      ansible.builtin.command:
        argv: [oc, create, -f, '-']
        stdin: |
          apiVersion: data-protection.isf.ibm.com/v1alpha1
          kind: Restore
          metadata:
            name: {{ restore_name }}
            namespace: {{ fusion_namespace }}
            labels:
              app.kubernetes.io/managed-by: {{ lab_managed_by }}
              app.kubernetes.io/part-of: fusion-lab02
          spec:
            backup: {{ backup_name }}
            namespaceMapping:
              {{ source_namespace }}: {{ restored_namespace }}
            overwrite: false
      when:
        - not ansible_check_mode
        - prior_restore.stdout | trim == ''

    - name: Poll restore until it completes or fails
      ansible.builtin.command:
        argv: [oc, get, restores.data-protection.isf.ibm.com, "{{ restore_name }}",
               -n, "{{ fusion_namespace }}", '-o', 'jsonpath={.status.phase}']
      register: restore_phase
      changed_when: false
      until: (restore_phase.stdout | trim) in ['Completed', 'Failed', 'Error', 'Cancelled', 'PartiallyFailed', 'PartiallyCompleted']
      retries: "{{ (restore_max_wait_seconds // poll_seconds) | int }}"
      delay: "{{ poll_seconds }}"
      when: not ansible_check_mode

    - name: Require successful restore
      ansible.builtin.assert:
        that:
          - "(restore_phase.stdout | trim) == 'Completed'"
        fail_msg: >-
          Restore status: {{ restore_phase.stdout | trim }}.
          Inspect: oc describe frestore {{ restore_name }} -n {{ fusion_namespace }}
      when: not ansible_check_mode

    - name: Wait for restored FileBrowser deployment to be ready
      ansible.builtin.command:
        argv: [oc, rollout, status, deployment/filebrowser,
               -n, "{{ restored_namespace }}", "--timeout={{ app_ready_max_wait_seconds }}s"]
      changed_when: false
      when: not ansible_check_mode

    - name: Calculate SHA-256 of restored persistent file
      ansible.builtin.command:
        argv: [oc, exec, deployment/filebrowser, -n, "{{ restored_namespace }}", --,
               sha256sum, "/files/{{ proof_file_name }}"]
      register: restored_checksum
      changed_when: false
      when: not ansible_check_mode

    - name: Verify recovered file matches original SHA-256 exactly
      ansible.builtin.assert:
        that:
          - "(restored_checksum.stdout.split()[0] | length) == 64"
          - "restored_checksum.stdout.split()[0] == source_checksum.stdout.split()[0]"
        fail_msg: "Data integrity FAILED: restored SHA-256 does not match source."
        success_msg: "DATA INTEGRITY PASSED: source and restored SHA-256 match."
      when: not ansible_check_mode

    - name: Print concise final lab report
      ansible.builtin.debug:
        msg:
          - "Hub API: {{ cluster_api.stdout | trim }}"
          - "S3 location: {{ backup_location_name }} / Connected"
          - "Fusion application: {{ fusion_application_name }}"
          - "Backup: {{ backup_name }} / {{ backup_phase.stdout | trim }}"
          - "Restore: {{ restore_name }} / {{ restore_phase.stdout | trim }}"
          - "Source namespace: {{ source_namespace }}"
          - "Restore namespace: {{ restored_namespace }}"
          - "Source SHA-256: {{ source_checksum.stdout.split()[0] }}"
          - "Restored SHA-256: {{ restored_checksum.stdout.split()[0] }}"
          - "Result: DATA INTEGRITY PASSED"
      when: not ansible_check_mode

    - name: Describe check-mode behavior
      ansible.builtin.debug:
        msg: "Preflight passed. Check mode does not create resources or execute backup/restore."
      when: ansible_check_mode
