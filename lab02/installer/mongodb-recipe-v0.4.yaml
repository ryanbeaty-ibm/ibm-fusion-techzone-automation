# Lab adaptation of the IBM-maintained MongoDB recipe:
# https://github.com/IBM/storage-fusion/blob/master/backup-restore/recipes/MongoDB/mongodb-image-based-backup-restore.yaml
# Runs with the authentication-disabled disposable MongoDB specified in pacman-all-v0.4.yaml.
# DO NOT reuse these commands for an authenticated production MongoDB.
apiVersion: spp-data-protection.isf.ibm.com/v1alpha1
kind: Recipe
metadata:
  name: mongodb-image-based-backup-restore-recipe
  namespace: ibm-spectrum-fusion-ns
  labels:
    app.kubernetes.io/part-of: fusion-lab02
    app.kubernetes.io/managed-by: lab02-ansible
spec:
  appType: mongodb
  groups:
    - name: mongodb-volumes
      type: volume
    - name: mongodb-resources
      type: resource
      excludedResourceTypes:
        - events
        - pods
        - replicasets
  hooks:
    - name: mongodb-deployment-check
      type: check
      namespace: ${GROUP.mongodb-resources.namespace}
      selectResource: deployment
      nameSelector: mongodb
      timeout: 120
      onError: fail
      chks:
        - name: replicasReady
          timeout: 180
          onError: fail
          condition: '{$.spec.replicas} == {$.status.readyReplicas}'
    - name: mongodb-pod-exec
      labelSelector: app=mongodb
      timeout: 300
      namespace: ${GROUP.mongodb-resources.namespace}
      onError: fail
      selectResource: pod
      type: exec
      ops:
        - name: fsyncLock
          container: mongodb
          timeout: 300
          onError: fail
          inverseOp: fsyncUnlock
          command: >
            ["/bin/bash", "-c", "/opt/bitnami/mongodb/bin/mongosh --quiet --eval \"db.fsyncLock()\""]
        - name: fsyncUnlock
          container: mongodb
          timeout: 300
          onError: fail
          command: >
            ["/bin/bash", "-c", "/opt/bitnami/mongodb/bin/mongosh --quiet --eval \"db.fsyncUnlock()\""]
  workflows:
    - name: backup
      sequence:
        - group: mongodb-resources
        - hook: mongodb-pod-exec/fsyncLock
        - group: mongodb-volumes
        - hook: mongodb-pod-exec/fsyncUnlock
    - name: restore
      sequence:
        - group: mongodb-volumes
        - group: mongodb-resources
        - hook: mongodb-deployment-check/replicasReady
